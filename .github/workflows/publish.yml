# Publishes one extension when you push a tag named <name>@<version>,
# for example: git tag agent-restore@2.0.1 && git push --tags
#
# Required secrets (Settings → Secrets and variables → Actions):
#   VSCE_PAT  — Azure DevOps token with the "Marketplace (Manage)" scope
#   OVSX_PAT  — open-vsx.org access token
name: Publish

on:
  push:
    tags: ['*@*']

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Resolve extension from tag
        id: ext
        run: |
          TAG="${GITHUB_REF_NAME}"
          NAME="${TAG%@*}"; VERSION="${TAG##*@}"
          DIR=$(grep -l "\"name\": \"$NAME\"" packages/*/package.json | xargs dirname)
          [ -n "$DIR" ] || { echo "Extension $NAME not found"; exit 1; }
          PKG_VERSION=$(node -p "require('./$DIR/package.json').version")
          [ "$PKG_VERSION" = "$VERSION" ] || { echo "Tag $VERSION ≠ package.json $PKG_VERSION"; exit 1; }
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "vsix=$NAME-$VERSION.vsix" >> "$GITHUB_OUTPUT"
      - name: Package
        working-directory: ${{ steps.ext.outputs.dir }}
        run: npx vsce package --no-dependencies -o ${{ steps.ext.outputs.vsix }}
      - name: Publish to VS Code Marketplace
        working-directory: ${{ steps.ext.outputs.dir }}
        run: npx vsce publish --packagePath ${{ steps.ext.outputs.vsix }} -p "${{ secrets.VSCE_PAT }}"
      - name: Publish to Open VSX
        working-directory: ${{ steps.ext.outputs.dir }}
        run: npx ovsx publish ${{ steps.ext.outputs.vsix }} -p "${{ secrets.OVSX_PAT }}"
      - name: Attach .vsix to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.ext.outputs.dir }}/${{ steps.ext.outputs.vsix }}
